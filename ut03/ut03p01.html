<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT03 · P01: Búsqueda de canciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
<!--
    PLANTILLA · UT03 · P01: Búsqueda de canciones
    Solo contiene la estructura HTML y los estilos. Busca los comentarios TODO
    para saber dónde tienes que añadir el código PHP.
    Este formulario ya está completo: no necesita PHP. Envía los datos a ut03p01-res.php.
-->
<section class="section">
    <div class="container" style="max-width: 600px;">
        <div class="card">
            <header class="card-header has-background-link">
                <p class="card-header-title has-text-white">
                    <i class="fa fa-music mr-2"></i> Búsqueda de canciones
                </p>
            </header>
            <div class="card-content">
                <form action="ut03p01-res.php" method="POST">

                    <div class="field">
                        <label class="label" for="texto">Texto a buscar:</label>
                        <div class="control has-icons-left">
                            <input class="input" type="text" id="texto" name="texto" placeholder="Escribe aquí..." required>
                            <span class="icon is-small is-left"><i class="fa fa-search"></i></span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Buscar en:</label>
                        <div class="control">
                            <label class="radio"><input type="radio" name="buscar_en" value="cancion"> Títulos de canción</label>
                            <label class="radio"><input type="radio" name="buscar_en" value="album"> Nombres de álbum</label>
                            <label class="radio"><input type="radio" name="buscar_en" value="ambos" checked> Ambos campos</label>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="genero">Género musical:</label>
                        <div class="control has-icons-left">
                            <div class="select is-fullwidth">
                                <select name="genero" id="genero">
                                    <option value="Todos" selected>Todos</option>
                                    <option value="Acústica">Acústica</option>
                                    <option value="Banda Sonora">Banda sonora</option>
                                    <option value="Blues">Blues</option>
                                    <option value="Electrónica">Electrónica</option>
                                    <option value="Folk">Folk</option>
                                    <option value="Jazz">Jazz</option>
                                    <option value="New Age">New Age</option>
                                    <option value="Pop">Pop</option>
                                    <option value="Rock">Rock</option>
                                </select>
                            </div>
                            <span class="icon is-small is-left"><i class="fa fa-list"></i></span>
                        </div>
                    </div>

                    <div class="field mt-5">
                        <button type="submit" class="button is-link is-fullwidth">
                            <i class="fa fa-search mr-2"></i> Buscar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>

</html>
